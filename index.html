<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linear Regression Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="20" x2="21" y2="4" />
            <circle cx="6.5" cy="14" r="2" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none" />
            <circle cx="17.5" cy="9" r="2" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <h1 class="app-title">Linear Regression</h1>
      </div>

      <div class="metrics-strip">
        <div class="metric-pill equation-pill">
          <span class="metric-value mono" id="equation-readout">
            ŷ = <span class="val-w" id="eq-w">0.00</span>x <span class="val-b" id="eq-b">+ 0.00</span>
          </span>
        </div>
        <div class="metric-pill mse-pill">
          <span class="metric-label">MSE</span>
          <span class="metric-value mono" id="mse-readout">0.00</span>
        </div>
      </div>

      <div class="actions-group">
        <button id="btn-best-fit" class="btn btn-primary" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          Best Fit
        </button>
        <button id="btn-random-line" class="btn btn-secondary" type="button">
          Random Line
        </button>
        <button id="btn-new-points" class="btn btn-secondary" type="button">
          New Points
        </button>
      </div>
    </header>

    <!-- Main Dashboard -->
    <main class="workspace-grid">
      <!-- Left Column: Scatter Plot + Controls -->
      <section class="panel main-panel">
        <div class="panel-header">
          <div class="axis-label-inputs">
            <label class="inline-field">
              <span class="field-tag">X</span>
              <input id="input-x-label" type="text" value="x" maxlength="18" placeholder="x" aria-label="X axis label" />
            </label>
            <label class="inline-field">
              <span class="field-tag">Y</span>
              <input id="input-y-label" type="text" value="y" maxlength="18" placeholder="y" aria-label="Y axis label" />
            </label>
          </div>

          <div class="preset-group" role="group" aria-label="Example datasets">
            <button type="button" class="preset-btn active" data-preset="random">Random</button>
            <button type="button" class="preset-btn" data-preset="house">House</button>
            <button type="button" class="preset-btn" data-preset="study">Study</button>
            <button type="button" class="preset-btn" data-preset="salary">Salary</button>
          </div>

          <div class="segmented-control" role="group" aria-label="Residuals">
            <button type="button" class="seg-btn active" data-residuals="lines">Residuals</button>
            <button type="button" class="seg-btn" data-residuals="squares">Squares</button>
            <button type="button" class="seg-btn" data-residuals="off">Off</button>
          </div>
        </div>

        <div class="canvas-stage main-canvas-stage">
          <canvas id="main-canvas"></canvas>
        </div>

        <!-- Sliders + Gradient Descent + Predict -->
        <div class="controls-deck">
          <div class="sliders-row">
            <div class="control-card">
              <div class="slider-header">
                <label for="slider-w" class="slider-label">
                  <span class="slider-dot dot-w"></span>
                  Slope (<span class="mono">w</span>)
                </label>
                <span class="slider-value mono val-w" id="val-w">0.00</span>
              </div>
              <input
                id="slider-w"
                type="range"
                min="-4"
                max="4"
                step="0.01"
                value="0"
                class="range-input range-w"
              />
            </div>

            <div class="control-card">
              <div class="slider-header">
                <label for="slider-b" class="slider-label">
                  <span class="slider-dot dot-b"></span>
                  Intercept (<span class="mono">b</span>)
                </label>
                <span class="slider-value mono val-b" id="val-b">0.00</span>
              </div>
              <input
                id="slider-b"
                type="range"
                min="-8"
                max="8"
                step="0.01"
                value="0"
                class="range-input range-b"
              />
            </div>
          </div>

          <div class="tools-row">
            <!-- Gradient Descent -->
            <div class="control-card gd-card">
              <div class="gd-controls">
                <button id="btn-gd-toggle" class="btn btn-gd" type="button">
                  <svg id="gd-play-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3" />
                  </svg>
                  <span id="gd-btn-label">Gradient Descent</span>
                </button>
                <button id="btn-gd-step" class="btn btn-mini" type="button" title="Run 1 gradient descent step">Step</button>
                <div class="lr-wrap" title="Learning rate (α): low = slow, middle = good, high = oscillate">
                  <span class="mono lr-label">α</span>
                  <input id="slider-lr" type="range" min="0" max="100" step="1" value="50" class="range-input range-lr" />
                  <span class="mono lr-val" id="val-lr">0.090</span>
                </div>
                <span class="mono gd-iter" id="gd-iter">#0</span>
              </div>
            </div>

            <!-- Predict -->
            <div class="control-card predict-card">
              <div class="predict-controls">
                <span class="predict-title">Predict</span>
                <label class="predict-input-wrap">
                  <span class="predict-var" id="predict-x-name">x</span>
                  <input id="input-predict-x" type="number" step="any" placeholder="2.5" aria-label="Predict X value" />
                </label>
                <span class="predict-arrow" aria-hidden="true">→</span>
                <div class="predict-output-wrap">
                  <span class="predict-var" id="predict-y-name">y</span>
                  <span class="mono predict-result" id="predict-y-output">—</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Right Column: Cost Function Graphs -->
      <aside class="cost-column">
        <section class="panel cost-panel">
          <div class="panel-header cost-header">
            <h2 class="panel-title">
              <span class="slider-dot dot-w"></span>
              MSE vs. Weight (<span class="mono">w</span>)
            </h2>
          </div>
          <div class="canvas-stage cost-canvas-stage">
            <canvas id="cost-w-canvas"></canvas>
          </div>
        </section>

        <section class="panel cost-panel">
          <div class="panel-header cost-header">
            <h2 class="panel-title">
              <span class="slider-dot dot-b"></span>
              MSE vs. Bias (<span class="mono">b</span>)
            </h2>
          </div>
          <div class="canvas-stage cost-canvas-stage">
            <canvas id="cost-b-canvas"></canvas>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js?v=8"></script>
</body>
</html>
